<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="content"></div>
    <script>
        const raw = `
<details class="ds-thinking">
<summary>💭 DeepSeek Thinking...</summary>

We need to respond in Bahasa Indonesia (default)...
I'll present it in a structured way with icons: <i data-lucide="search"></i> for search, <i data-lucide="terminal"></i> for terminal, <i data-lucide="alert-triangle"></i> for warnings. Dense and precise.

</details>

<i data-lucide="search"></i> **Investigasi mandiri dulu: kita culik log, baru eksekusi.**
        `;
        document.getElementById('content').innerHTML = marked.parse(raw);
        lucide.createIcons();
        console.log(document.getElementById('content').innerHTML);
    </script>
</body>
</html>
